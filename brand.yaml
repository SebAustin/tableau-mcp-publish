# =============================================================================
# brand.yaml — Vibe-BI brand kit
# =============================================================================
# This file controls how every dashboard generated by this MCP server looks
# and feels: colors, fonts, number formats, and named "personas" (CEO, CTO,
# Analyst, ...) that `design_dashboard` can target with `persona: "ceo"`
# instead of (or in addition to) a raw `audience`.
#
# Everything in this file is OPTIONAL. Delete a section — or the whole file —
# and sane built-in defaults take over automatically; you'll get a warning
# (not an error) from the `validate_brand` MCP tool if the file is missing.
#
# Run the `validate_brand` MCP tool any time after editing this file to check
# it parses and to see the list of persona names it defines.
#
# You do NOT need to touch any code to use this file — it is the single
# source of brand truth for this server.
# =============================================================================

# -----------------------------------------------------------------------------
# brand — your company/team identity
# -----------------------------------------------------------------------------
brand:
  # Your company or team name. Shown in dashboard proposal summaries and
  # (in a later phase) printed on generated title zones.
  name: "My Company"

  # Optional: path to a logo file on disk, for a future logo-embedding
  # feature. Leave blank if you don't have one yet.
  logoPath: ""

  # Optional: a public URL to your logo (alternative to logoPath).
  logoUrl: ""

# -----------------------------------------------------------------------------
# palette — the color system every chart/KPI pulls from
# -----------------------------------------------------------------------------
palette:
  # Categorical colors: used to tell DIFFERENT CATEGORIES apart (product
  # lines, regions, segments, ...) in bar/line charts. List as many hex
  # colors as you like — Tableau cycles through them in order. Defaults to
  # the well-known "Tableau 10" palette.
  categorical:
    - "#4e79a7"
    - "#f28e2b"
    - "#e15759"
    - "#76b7b2"
    - "#59a14f"
    - "#edc948"
    - "#b07aa1"
    - "#ff9da7"
    - "#9c755f"
    - "#bab0ac"

  # Sequential colors: a low-to-high ramp for a SINGLE continuous measure
  # (e.g. sales intensity on a filled map). Give 2 or 3 stops, light to dark.
  sequential:
    - "#c6dbef"
    - "#6baed6"
    - "#08519c"

  # Diverging colors: a ramp for values that move in TWO directions around a
  # midpoint (e.g. profit vs. loss, above/below target). Exactly 3 stops, in
  # order: [negative end, midpoint, positive end].
  diverging:
    - "#e15759"
    - "#f2f2f2"
    - "#59a14f"

  # Semantic colors: fixed meanings used for KPI deltas, status indicators,
  # and anywhere "good vs. bad" must be unambiguous, independent of the
  # categorical/sequential palette above.
  semantic:
    good: "#59a14f"    # e.g. a positive KPI delta, "on target" status
    bad: "#e15759"     # e.g. a negative KPI delta, "off target" status
    neutral: "#898989" # e.g. a flat/unchanged delta, secondary label text

# -----------------------------------------------------------------------------
# typography — fonts used across titles, body text, and KPI tiles
# -----------------------------------------------------------------------------
# "Tableau Bold" and "Tableau Book" ship with every Tableau install, so they
# always render correctly without the viewer needing the font installed.
# Swap in a licensed corporate font here if your organization has one.
typography:
  title:
    font: "Tableau Bold"
    size: 24
    color: "#1f1f1f"

  body:
    font: "Tableau Book"
    size: 11
    color: "#4d4d4d"

  # BAN = "Big Number" — the large hero figure inside a KPI tile (e.g. the
  # "$1.2M" in a Total Sales tile). Deliberately large and bold so it reads
  # from across a room.
  ban:
    font: "Tableau Bold"
    size: 36

# -----------------------------------------------------------------------------
# formats — number/currency/percent display formats
# -----------------------------------------------------------------------------
# Values use Tableau's format-string syntax (e.g. "#,##0" or "$#,##0.00").
formats:
  currency: "$#,##0"
  percent: "0.0%"
  number: "#,##0"
  # When true, large numbers are abbreviated (1.2M instead of 1,234,567) in
  # KPI tiles and axis labels.
  compact: true

# -----------------------------------------------------------------------------
# rules — free-text design do's and don'ts
# -----------------------------------------------------------------------------
# Documentational only: these are NOT enforced by code today. They're read by
# `validate_brand` and future planner phases as house-style notes for anyone
# — human or agent — building a dashboard for your organization.
rules:
  - "Do lead every executive dashboard with a KPI band of 3-4 metrics."
  - "Do use direct labeling on bars instead of a legend when there are 5 or fewer categories."
  - "Do use the sequential palette for magnitude (e.g. sales intensity), never the categorical palette."
  - "Don't use pie charts — prefer bar charts or 100% stacked bars."
  - "Don't use gauges — prefer bullet graphs (Stephen Few)."
  - "Don't use 3D effects or drop shadows on marks."

# -----------------------------------------------------------------------------
# personas — named audiences
# -----------------------------------------------------------------------------
# `design_dashboard` accepts `persona: "ceo"` instead of (or alongside)
# `audience`. Add, remove, or rename personas freely — no code changes
# required. Each persona is a key (the name you pass as `persona:`) mapped to:
#
#   base               (required) one of: exec | analyst | operational | mixed
#                       — the underlying audience profile this persona builds on.
#   maxSheets          (optional) override the max number of chart sheets.
#   kpiEmphasis        (optional) high | medium | low — how prominent the KPI
#                       band should be (documentational hint for now).
#   preferredArtifact  (optional) dashboard | story | pulse — the artifact
#                       type this persona prefers when the agent has a choice.
#   tone               (optional) concise | detailed — wording style for
#                       generated titles/summaries.
#   chartDeny          (optional) list of chart types this persona never wants
#                       to see (e.g. ["pie", "scatter"]).
#   notes              (optional) free-text reminder for anyone designing for
#                       this persona.
personas:
  ceo:
    base: exec
    maxSheets: 3
    kpiEmphasis: high
    preferredArtifact: dashboard
    tone: concise
    notes: "Headline numbers only. No axis labels, no jargon."

  cto:
    base: exec
    maxSheets: 4
    kpiEmphasis: medium
    preferredArtifact: dashboard
    tone: concise
    chartDeny: ["pie"]
    notes: "Cares about trend and reliability metrics as much as revenue."

  slt_manager:
    base: mixed
    maxSheets: 6
    kpiEmphasis: medium
    preferredArtifact: dashboard
    tone: detailed
    notes: "Senior Leadership Team manager — wants a broader view than the CEO."

  analyst:
    base: analyst
    kpiEmphasis: low
    preferredArtifact: dashboard
    tone: detailed
    notes: "Wants full axis labels, drill-down detail, and every relevant dimension."

  client:
    base: operational
    maxSheets: 4
    kpiEmphasis: high
    preferredArtifact: dashboard
    tone: concise
    chartDeny: ["scatter", "map"]
    notes: "External audience — keep it simple, on-brand, and jargon-free."
