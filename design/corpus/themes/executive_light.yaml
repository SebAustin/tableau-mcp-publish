# executive_light — white cards, hairline borders (WB-118 / WB-114 direction).
#
# Every hex/px literal below is copied verbatim from a `provenance` entry's
# cited construct in design/corpus/recipes/*.yaml (enforced by
# tests/designCorpus.test.ts's "theme-cites-recipe" check). See
# design/corpus/SCHEMA.md for the full schema + provenance rules.

name: executive_light

tags:
  audiences: [exec, mixed]
  personas: [slt_manager, client]
  artifacts: [dashboard, story]
  mood: light

provenance:
