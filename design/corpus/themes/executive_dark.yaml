dashboardBackground: "#2f2e41"

spacing:
  outerMargin: "25"
  gutter: "30"

chartCard:
  background: "#f5f3f4"
  borderColor: "#000000"
  borderStyle: none
  borderWidth: "0"
  padding: "25"
  margin: "0"
  # cornerRadius intentionally omitted — no mined zone-style in the D0 corpus
  # uses the plain `corner-radius` format attr (only the XSD-illegal
  # `_.fcp.DashboardRoundedCorners...` element form appears in the source
  # exemplars, which must never be mirrored per PLAN.md's XSD verification).

kpiTile:
  background: "#2f2e41"
  banColor: "#ffffff"
  padding: "4"
  useSemanticDeltaColors: true

header:
  background: "#2f2e41"
  titleColor: "#ffffff"
  subtitleColor: "#ffffff"

chrome:
  hideGridlines: true
  hideZeroline: true
  hideAxisTicks: true
  showMarkLabels: true
  datalabel:
    fontSize: "9"
    fontWeight: bold
    colorMode: fixed
