name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Node 22 line (spec intent; 22.7.5 isn't in the setup-node manifest, so latest 22)
        # + current line (24.x) + local dev runtime (26.x).
        node: ["22.x", "24.x", "26.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test

  python-sidecar:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - name: Sync (authoring + dev tools; no DB drivers)
        working-directory: sidecar
        run: uv sync --extra dev --frozen
      - name: Ruff
        working-directory: sidecar
        run: uv run ruff check .
      - name: mypy --strict
        working-directory: sidecar
        run: uv run mypy --strict .
      - name: Pytest (Hyper API runs headless on the runner)
        working-directory: sidecar
        run: uv run pytest -q
